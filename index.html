<html>
    <head>
        <title>My First Web Page</title>
        <meta charset="UTF-8">
        <meta name="keywords" content="HTML, 1235 Heading, paragrah">
    </head>
    
    <body>
        <h1>Welcome to My Website</h1>
        <p>This is my first paragraph.</p>
        <p><b>This is unordered list "ul"</b></p>
        <ul style="list-style-type:circle">
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ul>
        <p><strong>This is ordered list "ol"</strong></p>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>

    </body>
</html>
