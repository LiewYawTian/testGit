<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <p>The length property returns the length of an array.</p>
    <p id="demo"></p>
    <p id="list"></p>

    <script>
        var flowers = ["Rose", "Lavender", "Carnation", "Orchid"];
        document.getElementById("demo").innerHTML = flowers.length;
        flowers.sort();
        document.getElementById("list").innerHTML = flowers.join("<br>");
    </script>

    <script>
        var flowersl = ["Rose", "Lavender", "Carnation", "Orchid"];
        flowersl.sort();

        for(i = 0; i <flowersl.length; i++)
        {
            document.writeln(flowersl[i]);
        }
    </script>

    <h1>Array data on a Table</h1>
    <table border = "1">
    
    <script language = "javascript" type = "text/javascript">
        var myArray = new Array();
        myArray[0] = "1";
        myArray[1] = "2";
        myArray[2] = "3";
        myArray[3] = "4";
        myArray[4] = "5";

        for (var i=0; i < 5; i++)
    {
        document.write("<tr><td>Number" + i + " is:</td>");
        document.write("<td>" + myArray[i] + "</td></tr>");
    }

    </script>

    </table>
</body>
</html>
