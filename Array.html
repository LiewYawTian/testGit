<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <p id="demo"></p>
    <p id="demos"></p>

    <script>
        var computers = ["Desktop", " Laptop", " Notobook"]; //var is the key word for the array and variable
        document.getElementById("demo").innerHTML = computers;
    </script>

    <script>
        var person = ["Mike", "Johnson", 26 + 102.4];
        document.getElementById("demos").innerHTML = person;
    </script>
</body>
</html>
